version: 2

updates:
  # npm dependencies (Angular, Firebase, Cypress, etc.)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      # Capacitor's CLI, core and platform packages must share a major version;
      # bumped one at a time, each PR leaves the native build broken. Listed first
      # so it takes precedence over the patch/minor group.
      capacitor:
        patterns:
          - "@capacitor/*"
      # Patch/minor bumps are extremely unlikely to break anything under semver
      # and are bundled into a single low-noise PR, auto-merged once CI is green
      # (see .github/workflows/dependabot-auto-merge.yml).
      npm-patch-and-minor:
        update-types:
          - "minor"
          - "patch"
    # Major bumps (e.g. a future Angular 21) are intentionally left out of the
    # group above, so each lands as its own PR for manual review — see
    # SECURITY.md / plan.md #49 for why the Angular major bump specifically is
    # a deliberate, isolated migration and not something to auto-merge.
    ignore:
      # Angular's own major bumps must happen as one coordinated migration
      # across the whole stack (core, cli, devkit, ...), never piecemeal —
      # not even when framed as a security fix for a transitive dep inside
      # @angular/build (vite/postcss/piscina/etc.). Bumping the build
      # toolchain alone to a major ahead of @angular/core produces a
      # guaranteed-broken toolchain (seen 2026-09-25: 6 PRs, 100% CI failure).
      # Ignore rules cover both version and security updates.
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@angular-devkit/*"
        update-types: ["version-update:semver-major"]
      # These majors track Angular's and land with the Angular migration.
      - dependency-name: "@ngrx/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "angular-eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@angular-eslint/*"
        update-types: ["version-update:semver-major"]
      # Must match the Node major the workflows run on (node-version: '22').
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Karma's jasmine stack moves with the test runner migration, not on its own.
      - dependency-name: "jasmine-core"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/jasmine"
        update-types: ["version-update:semver-major"]
      # v16 → v18 changes the provider API; planned as a dedicated migration.
      - dependency-name: "@ngx-translate/*"
        update-types: ["version-update:semver-major"]

  # GitHub Actions versions used in workflows (actions/checkout, setup-node, ...)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Rome"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
