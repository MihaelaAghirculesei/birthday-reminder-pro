name: Dependabot auto-merge

# Deliberately does NOT use GitHub's native "auto-merge" (gh pr merge --auto):
# that only waits for checks marked *required* in branch protection, and this
# repo intentionally has none on main (a required status check rejects direct
# pushes too — GitHub can't have a passing check for a commit that doesn't
# exist yet — which would break pushing straight to main outside a PR).
#
# Instead this job polls the PR's own "All Checks Passed" status — the same
# aggregator ci.yml's status-check job computes from lint/security/unit/e2e/
# security-rules/build/bundle-size — and merges once THAT specifically is
# green. Deliberately not `gh pr checks --fail-fast`: that aborts on ANY
# failing check, including ones the repo itself treats as non-blocking (e.g.
# "Visual Regression (informational, non-blocking)", which fails on most
# dependency bumps because baseline screenshots shift — that's expected, not
# a real problem, and used to make every PR here look "failed").
#
# pull_request_target (not workflow_run): dependabot/fetch-metadata needs a
# real `pull_request` event payload to read the update metadata from — it
# does not work against workflow_run (see dependabot/fetch-metadata#490).
# Safe here because this job never checks out or executes the PR's code, it
# only reads Dependabot's metadata and drives the GitHub API via `gh`.
on:
  pull_request_target:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  dependabot:
    name: Auto-merge patch/minor updates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.actor == 'dependabot[bot]'

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # Block only on an explicit major (e.g. a future Angular 21 — see
      # .github/dependabot.yml). Everything else proceeds to the CI gate below,
      # including grouped security-update PRs, where fetch-metadata reports
      # update-type as empty/null (seen with a grouped `undici` fix touching
      # the same package at multiple lockfile locations) rather than a real
      # semver-patch/minor value. "All Checks Passed" — the full test/build
      # suite — is the actual safety net, not this classification.
      - name: Wait for "All Checks Passed", then merge non-major updates
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: |
          for i in $(seq 1 40); do
            RESULT=$(gh pr view "$PR_URL" --json statusCheckRollup \
              --jq '[.statusCheckRollup[]? | select(.name=="All Checks Passed")][0] // {}')
            STATUS=$(echo "$RESULT" | jq -r '.status // "PENDING"')
            CONCLUSION=$(echo "$RESULT" | jq -r '.conclusion // ""')
            echo "All Checks Passed: status=$STATUS conclusion=$CONCLUSION (attempt $i/40)"
            if [ "$STATUS" = "COMPLETED" ]; then
              break
            fi
            sleep 30
          done

          # A timeout means CI never reported back, which needs a human to look at.
          if [ "$STATUS" != "COMPLETED" ]; then
            echo "::error::All Checks Passed still $STATUS after 20 minutes — not merging."
            gh api -X POST "repos/$REPO/pulls/$PR_NUMBER/requested_reviewers" -f "reviewers[]=$OWNER"
            exit 1
          fi

          # A red CI is already reported by CI itself. Declining to merge is this
          # job doing its work, so it must not add a second red X to the same PR.
          if [ "$CONCLUSION" != "SUCCESS" ]; then
            echo "::notice::All Checks Passed concluded $CONCLUSION — not merging."
            gh pr comment "$PR_URL" --body "CI did not pass (All Checks Passed: $CONCLUSION) — auto-merge skipped, needs manual review."
            gh api -X POST "repos/$REPO/pulls/$PR_NUMBER/requested_reviewers" -f "reviewers[]=$OWNER"
            exit 0
          fi

          gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Whenever the PR is left for a human (major, red CI, timeout), the
      # owner is requested as reviewer: that sends a direct notification, so
      # the PR does not sit unnoticed among routine Dependabot traffic.
      - name: Flag major updates for manual review
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: |
          gh pr comment "$PR_URL" --body "Major version update — needs manual review before merge (auto-merge skipped)."
          gh api -X POST "repos/$REPO/pulls/$PR_NUMBER/requested_reviewers" -f "reviewers[]=$OWNER"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
