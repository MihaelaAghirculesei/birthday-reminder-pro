name: Dependabot auto-merge

# Deliberately does NOT use GitHub's native "auto-merge" (gh pr merge --auto):
# that only waits for checks marked *required* in branch protection, and this
# repo intentionally has none on main (a required status check rejects direct
# pushes too — GitHub can't have a passing check for a commit that doesn't
# exist yet — which would break pushing straight to main outside a PR).
#
# Instead this job polls the PR's own "All Checks Passed" status — the same
# aggregator ci.yml's status-check job computes from lint/security/unit/e2e/
# security-rules/build/bundle-size — and merges once THAT specifically is
# green. Deliberately not `gh pr checks --fail-fast`: that aborts on ANY
# failing check, including ones the repo itself treats as non-blocking (e.g.
# "Visual Regression (informational, non-blocking)", which fails on most
# dependency bumps because baseline screenshots shift — that's expected, not
# a real problem, and used to make every PR here look "failed").
#
# pull_request_target (not workflow_run): dependabot/fetch-metadata needs a
# real `pull_request` event payload to read the update metadata from — it
# does not work against workflow_run (see dependabot/fetch-metadata#490).
# Safe here because this job never checks out or executes the PR's code, it
# only reads Dependabot's metadata and drives the GitHub API via `gh`.
on:
  pull_request_target:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  dependabot:
    name: Auto-merge patch/minor updates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.actor == 'dependabot[bot]'

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # Patch and minor bumps only. Major bumps (e.g. a future Angular 21) are
      # deliberately left for manual review — see .github/dependabot.yml.
      - name: Wait for "All Checks Passed", then merge patch/minor updates
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: |
          for i in $(seq 1 40); do
            RESULT=$(gh pr view "$PR_URL" --json statusCheckRollup \
              --jq '[.statusCheckRollup[]? | select(.name=="All Checks Passed")][0] // {}')
            STATUS=$(echo "$RESULT" | jq -r '.status // "PENDING"')
            CONCLUSION=$(echo "$RESULT" | jq -r '.conclusion // ""')
            echo "All Checks Passed: status=$STATUS conclusion=$CONCLUSION (attempt $i/40)"
            if [ "$STATUS" = "COMPLETED" ]; then
              break
            fi
            sleep 30
          done

          if [ "$CONCLUSION" != "SUCCESS" ]; then
            echo "All Checks Passed did not succeed (status=$STATUS, conclusion=$CONCLUSION) — not merging."
            exit 1
          fi

          gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Flag major updates for manual review
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: gh pr comment "$PR_URL" --body "Major version update — needs manual review before merge (auto-merge skipped)."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
